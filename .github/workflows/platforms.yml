name: Platforms

# Builds the native libraries of every supported platform, tests each of them on
# a runner of its own OS and architecture, and hands them on as artifacts:
# natives-<platform> holds the webrtc-java native jar, natives-media-<platform>
# the webrtc-java-media one. Nothing is deployed here; the callers do that once,
# from all platforms together, because Maven Central publishes a version as one
# bundle.
#
# Called by build.yml for every push and PR, and by release-publish.yml for the tag it
# releases (and release.yml for dry runs), so that both build exactly the same way.

on:
  workflow_call:
    inputs:
      version:
        description: "Optional local project version override for a release dry run."
        type: string
        default: ''
      retention-days:
        description: "How long the natives artifacts are kept."
        type: number
        default: 1

env:
  # The default webrtc.install.dir of webrtc-jni/pom.xml, below the home directory.
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        # profile: the Maven profile that selects a cross compiled classifier;
        #   empty when the classifier is the runner's own. The macOS Intel
        #   build runs on Apple Silicon and cross compiles.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            profile: ''
          - name: windows_arm64
            runs-on: windows-2022
            profile: windows-aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            profile: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04
            profile: linux-aarch64
          - name: linux_arm
            runs-on: ubuntu-22.04
            profile: linux-aarch32
          - name: macos_arm64
            runs-on: macos-15
            profile: ''
          - name: macos_x86-64
            runs-on: macos-15
            profile: macos-cross-x86_64
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The media module builds FFmpeg from its third-party submodule.
          submodules: true

      - name: Prepare build
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows

      - name: Prepare build
        if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-linux

      - name: Prepare build
        if: runner.os == 'macOS'
        uses: ./.github/actions/prepare-macos

      - name: Set the release dry-run version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
        shell: bash

      - name: Maven build
        uses: ./.github/actions/build
        with:
          platform-name: ${{ matrix.platform.name }}
          profile: ${{ matrix.platform.profile }}
          retention-days: ${{ inputs.retention-days }}

  # Every platform is tested on a runner of its own OS and architecture,
  # against the natives the build job uploaded, so that what is tested is
  # exactly what gets published. Most of them are cross compiled and could not
  # be loaded on the runner that built them.
  test-natives:
    name: test-natives (${{ matrix.platform.name }})
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # java-architecture: the JDK architecture, when it differs from the
        #   runner's. linux_arm runs a 32-bit ARM JDK on an arm64 runner.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            classifier: windows-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: windows_arm64
            runs-on: windows-11-arm
            classifier: windows-aarch64
            java-distribution: microsoft
            java-architecture: aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            classifier: linux-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch32
            java-distribution: liberica
            java-architecture: armv7
          - name: macos_arm64
            runs-on: macos-15
            classifier: macos-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: macos_x86-64
            runs-on: macos-15-intel
            classifier: macos-x86_64
            java-distribution: temurin
            java-architecture: ''
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Test natives
        uses: ./.github/actions/test-natives
        with:
          platform-name: ${{ matrix.platform.name }}
          classifier: ${{ matrix.platform.classifier }}
          profile: ${{ matrix.platform.classifier }}
          java-distribution: ${{ matrix.platform.java-distribution }}
          java-architecture: ${{ matrix.platform.java-architecture }}
          version: ${{ inputs.version }}

  # The tests once more under -Xcheck:jni, once per OS: the JNI glue is shared,
  # but the device modules, capturers and hardware codecs that call back into
  # Java are not, so each OS has JNI code of its own. One architecture each is
  # enough, since that code is the same across them. It fails on any JNI error
  # or warning, see the test-natives action. Disabled for now.
  jni-check:
    name: jni-check (${{ matrix.platform.name }})
    if: false
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            classifier: linux-x86_64
          - name: macos_arm64
            runs-on: macos-15
            classifier: macos-aarch64
          - name: windows_x86_64
            runs-on: windows-2022
            classifier: windows-x86_64
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Test natives under -Xcheck:jni
        uses: ./.github/actions/test-natives
        with:
          platform-name: ${{ matrix.platform.name }}
          classifier: ${{ matrix.platform.classifier }}
          profile: ${{ matrix.platform.classifier }}
          java-distribution: temurin
          version: ${{ inputs.version }}
          jni-check: 'true'

  # The native image example, built with GraalVM against the natives the build
  # job uploaded, which the image carries inside itself. It connects two peers
  # and exits with an error unless video, audio, channel messages, statistics
  # and log messages all arrived. --exact-reachability-metadata makes anything
  # the metadata of webrtc-java lacks fail at once, which would otherwise only
  # fail where a lookup happens to find nothing.
  native-image:
    name: native-image (linux_x86-64)
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download natives
        uses: actions/download-artifact@v8
        with:
          name: natives-linux_x86-64
          path: natives

      - name: Download media natives
        uses: actions/download-artifact@v8
        with:
          name: natives-media-linux_x86-64
          path: natives

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 libxrandr2 libxcomposite1 libglib2.0-0 libgbm1 libdrm2

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - name: Set the release dry-run version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      # The example resolves the libraries from the local repository, natives
      # included, as an application does. webrtc attaches its natives from
      # webrtc-jni/target and needs them installed beforehand, since it depends
      # on them itself; webrtc-media packages its own from target/natives.
      - name: Install the libraries with the natives
        run: |
          VERSION=$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' pom.xml | head -n 1)
          WEBRTC_JAR=$(find natives -name 'webrtc-java-*-linux-x86_64.jar' ! -name 'webrtc-java-media-*' | head -n 1)
          MEDIA_JAR=$(find natives -name 'webrtc-java-media-*-linux-x86_64.jar' | head -n 1)

          if [ -z "$VERSION" ] || [ -z "$WEBRTC_JAR" ] || [ -z "$MEDIA_JAR" ]; then
            echo "Missing the version ($VERSION) or a native jar ($WEBRTC_JAR, $MEDIA_JAR)" >&2
            exit 1
          fi

          mvn -B -q install:install-file -Dfile="$WEBRTC_JAR" -DgroupId=dev.onvoid.webrtc \
            -DartifactId=webrtc-java -Dversion="$VERSION" -Dpackaging=jar -Dclassifier=linux-x86_64

          mkdir -p webrtc-jni/target webrtc-media/target/natives
          cp "$WEBRTC_JAR" "webrtc-jni/target/webrtc-java-$VERSION-linux-x86_64.jar"
          (cd webrtc-media/target/natives && "$JAVA_HOME/bin/jar" xf "$GITHUB_WORKSPACE/$MEDIA_JAR" && rm -rf META-INF)

          mvn -B -pl webrtc,webrtc-media,webrtc-swing,webrtc-javafx install -DskipNativeBuild -DskipTests

      - name: Build the native image
        run: mvn -B -pl webrtc-examples -Pnative package

      - name: Run the native image
        run: timeout 120 webrtc-examples/target/webrtc-native-image-example
