name: Platforms

# Builds the native libraries of every supported platform, tests each of them on
# a runner of its own OS and architecture, and hands them on as artifacts: natives-<platform> holds the webrtc-java native jar,
# natives-media-<platform> the webrtc-java-media one. Nothing is deployed here;
# the callers do that once, from all platforms together, because Maven Central
# publishes a version as one bundle.
#
# Called by build.yml for every push and PR, and by release.yml for the tag it
# releases, so that both build exactly the same way.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit, branch or tag to build. Empty for the one that triggered the caller."
        type: string
        default: ''
      retention-days:
        description: "How long the natives artifacts are kept."
        type: number
        default: 1

env:
  # The default webrtc.install.dir of webrtc-jni/pom.xml, below the home directory.
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build:
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        # profile: the Maven profile that selects a cross compiled classifier;
        #   empty when the classifier is the runner's own. The macOS Intel
        #   build runs on Apple Silicon and cross compiles.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            profile: ''
          - name: windows_arm64
            runs-on: windows-2022
            profile: windows-aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            profile: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04
            profile: linux-aarch64
          - name: linux_arm
            runs-on: ubuntu-22.04
            profile: linux-aarch32
          - name: macos_arm64
            runs-on: macos-14
            profile: ''
          - name: macos_x86-64
            runs-on: macos-14
            profile: macos-cross-x86_64
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # The media module builds FFmpeg from its third-party submodule.
          submodules: true

      - name: Prepare build
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows

      - name: Prepare build
        if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-linux

      - name: Prepare build
        if: runner.os == 'macOS'
        uses: ./.github/actions/prepare-macos

      - name: Maven build
        uses: ./.github/actions/build
        with:
          platform-name: ${{ matrix.platform.name }}
          profile: ${{ matrix.platform.profile }}
          retention-days: ${{ inputs.retention-days }}

  # Every platform is tested on a runner of its own OS and architecture,
  # against the natives the build job uploaded, so that what is tested is
  # exactly what gets published. Most of them are cross compiled and could not
  # be loaded on the runner that built them.
  test-natives:
    name: test-natives (${{ matrix.platform.name }})
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # java-architecture: the JDK architecture, when it differs from the
        #   runner's. linux_arm runs a 32-bit ARM JDK on an arm64 runner.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            classifier: windows-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: windows_arm64
            runs-on: windows-11-arm
            classifier: windows-aarch64
            java-distribution: microsoft
            java-architecture: aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            classifier: linux-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch32
            java-distribution: liberica
            java-architecture: armv7
          - name: macos_arm64
            runs-on: macos-14
            classifier: macos-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: macos_x86-64
            runs-on: macos-15-intel
            classifier: macos-x86_64
            java-distribution: temurin
            java-architecture: ''
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Test natives
        uses: ./.github/actions/test-natives
        with:
          platform-name: ${{ matrix.platform.name }}
          classifier: ${{ matrix.platform.classifier }}
          profile: ${{ matrix.platform.classifier }}
          java-distribution: ${{ matrix.platform.java-distribution }}
          java-architecture: ${{ matrix.platform.java-architecture }}
