name: Platforms

# Builds the native libraries of every supported platform, tests each of them on
# a runner of its own OS and architecture, and hands them on as artifacts:
# natives-<platform> holds the webrtc-java native jar, natives-media-<platform>
# the webrtc-java-media one. Nothing is deployed here; the callers do that once,
# from all platforms together, because Maven Central publishes a version as one
# bundle.
#
# Called by build.yml for every push and PR, and by release.yml for the tag it
# releases, so that both build exactly the same way.

on:
  workflow_call:
    inputs:
      ref:
        description: "Release tag on main to build (vX.Y.Z). Empty for the commit that triggered the caller."
        type: string
        default: ''
      version:
        description: "Optional local project version override for a release dry run."
        type: string
        default: ''
      retention-days:
        description: "How long the natives artifacts are kept."
        type: number
        default: 1
    outputs:
      sha:
        description: "The validated commit built and tested by this workflow."
        value: ${{ jobs.resolve-ref.outputs.sha }}

env:
  # The default webrtc.install.dir of webrtc-jni/pom.xml, below the home directory.
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  # Resolve once, before any repository code runs or caches are accessed. A
  # release may build the tag just pushed by prepare-release, but only if its
  # commit is already in main. All consumers use the resulting immutable SHA.
  resolve-ref:
    name: Resolve build commit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Fetch release history
        if: inputs.ref != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and resolve the build commit
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$REQUESTED_REF" ]; then
            echo "sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$REQUESTED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref must be a release tag of the form vX.Y.Z"
            exit 1
          fi

          release_sha=$(git rev-parse --verify "refs/tags/$REQUESTED_REF^{commit}")
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit on main"
            exit 1
          fi

          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-ref
    name: build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        # profile: the Maven profile that selects a cross compiled classifier;
        #   empty when the classifier is the runner's own. The macOS Intel
        #   build runs on Apple Silicon and cross compiles.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            profile: ''
          - name: windows_arm64
            runs-on: windows-2022
            profile: windows-aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            profile: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04
            profile: linux-aarch64
          - name: linux_arm
            runs-on: ubuntu-22.04
            profile: linux-aarch32
          - name: macos_arm64
            runs-on: macos-14
            profile: ''
          - name: macos_x86-64
            runs-on: macos-14
            profile: macos-cross-x86_64
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          # The media module builds FFmpeg from its third-party submodule.
          submodules: true

      - name: Prepare build
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows

      - name: Prepare build
        if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-linux

      - name: Prepare build
        if: runner.os == 'macOS'
        uses: ./.github/actions/prepare-macos

      - name: Set the release dry-run version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
        shell: bash

      - name: Maven build
        uses: ./.github/actions/build
        with:
          platform-name: ${{ matrix.platform.name }}
          profile: ${{ matrix.platform.profile }}
          retention-days: ${{ inputs.retention-days }}

  # Every platform is tested on a runner of its own OS and architecture,
  # against the natives the build job uploaded, so that what is tested is
  # exactly what gets published. Most of them are cross compiled and could not
  # be loaded on the runner that built them.
  test-natives:
    name: test-natives (${{ matrix.platform.name }})
    needs: [resolve-ref, build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # java-architecture: the JDK architecture, when it differs from the
        #   runner's. linux_arm runs a 32-bit ARM JDK on an arm64 runner.
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
            classifier: windows-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: windows_arm64
            runs-on: windows-11-arm
            classifier: windows-aarch64
            java-distribution: microsoft
            java-architecture: aarch64
          - name: linux_x86-64
            runs-on: ubuntu-22.04
            classifier: linux-x86_64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm64
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: linux_arm
            runs-on: ubuntu-22.04-arm
            classifier: linux-aarch32
            java-distribution: liberica
            java-architecture: armv7
          - name: macos_arm64
            runs-on: macos-14
            classifier: macos-aarch64
            java-distribution: temurin
            java-architecture: ''
          - name: macos_x86-64
            runs-on: macos-15-intel
            classifier: macos-x86_64
            java-distribution: temurin
            java-architecture: ''
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Test natives
        uses: ./.github/actions/test-natives
        with:
          platform-name: ${{ matrix.platform.name }}
          classifier: ${{ matrix.platform.classifier }}
          profile: ${{ matrix.platform.classifier }}
          java-distribution: ${{ matrix.platform.java-distribution }}
          java-architecture: ${{ matrix.platform.java-architecture }}
          version: ${{ inputs.version }}
