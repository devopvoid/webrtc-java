name: 'Test Natives'

description: 'Run the test suite on a native runner against natives that a cross compiling lane built'

inputs:
  platform-name:
    description: 'The platform name of the lane that built the natives.'
    required: true

  classifier:
    description: 'The Maven classifier of the natives.'
    required: true

  profile:
    description: 'The Maven profile that selects the classifier.'
    required: true

  java-version:
    description: 'The Java version.'
    required: true
    default: '17'

  java-distribution:
    description: 'The setup-java distribution. It must provide a JDK for the runner architecture.'
    required: true
    default: 'temurin'

  java-architecture:
    description: 'The JDK architecture, when it differs from the runner architecture.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Download natives
      uses: actions/download-artifact@v4
      with:
        name: natives-${{ inputs.platform-name }}
        path: natives

    # PulseAudio, libudev and libdbus are deliberately not installed here: the
    # natives open them at runtime, and the armhf lane, whose image has none of
    # them, proves that they load without them.
    - name: Install 32-bit runtime libraries
      if: runner.os == 'Linux' && inputs.java-architecture == 'armv7'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y libc6:armhf libstdc++6:armhf zlib1g:armhf libx11-6:armhf libxext6:armhf libxfixes3:armhf libxdamage1:armhf libxtst6:armhf libxrandr2:armhf libxcomposite1:armhf libglib2.0-0:armhf libgbm1:armhf libdrm2:armhf
      shell: bash

    - name: Install runtime libraries
      if: runner.os == 'Linux' && inputs.java-architecture != 'armv7'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 libxrandr2 libxcomposite1 libglib2.0-0 libgbm1 libdrm2
      shell: bash

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        architecture: ${{ inputs.java-architecture }}

    - name: Ensure Maven
      run: |
        if ! command -v mvn >/dev/null 2>&1; then
          curl -sSLo maven.zip https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.zip
          unzip -q maven.zip -d "$RUNNER_TEMP/maven"
          echo "$RUNNER_TEMP/maven/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
        fi
      shell: bash

    - name: Install the natives into the local repository
      run: |
        VERSION=$(sed -n '0,/<version>/s|.*<version>\([^<]*\)</version>.*|\1|p' pom.xml)
        JAR=$(find natives -path '*webrtc-jni*' -name 'webrtc-java-*.jar' | head -n 1)
        echo "Installing $JAR as webrtc-java:$VERSION:${{ inputs.classifier }}"
        mvn -B -q install:install-file -Dfile="$JAR" -DgroupId=dev.onvoid.webrtc \
          -DartifactId=webrtc-java -Dversion="$VERSION" -Dpackaging=jar \
          -Dclassifier=${{ inputs.classifier }}
      shell: bash

    # The media module reads its natives from the directory its own build
    # collects them into, which is also how they are found when it builds them
    # itself. Unpacking the jar there is all it takes to point the tests at the
    # ones this lane is meant to exercise.
    - name: Unpack the media natives where the tests look for them
      run: |
        MEDIA_JAR=$(find natives -name 'webrtc-java-media-*-${{ inputs.classifier }}.jar' | head -n 1)

        if [ -z "$MEDIA_JAR" ]; then
          echo "No webrtc-java-media natives for ${{ inputs.classifier }} in the artifact" >&2
          exit 1
        fi

        MEDIA_JAR="$PWD/$MEDIA_JAR"
        echo "Unpacking $MEDIA_JAR"

        mkdir -p webrtc-java-media/target/natives
        cd webrtc-java-media/target/natives
        # jar rather than unzip: the JDK is set up above, and unzip is not on
        # every runner image.
        "$JAVA_HOME/bin/jar" xf "$MEDIA_JAR"
        rm -rf META-INF
        ls -l
      shell: bash

    # webrtc is installed rather than only tested, so that the media module
    # below resolves it from the repository. Putting both in one reactor does
    # not work: Maven then substitutes the module's own output for the
    # dependency, and webrtc-java's natives, which are a classifier artifact of
    # that same module, never reach the class path. Installing is seconds, and
    # javadoc and sources belong to the release profile rather than to this.
    - name: Test
      run: mvn -B -pl webrtc install -P${{ inputs.profile }}
      shell: bash

    # The native build is off: these natives were cross compiled by another
    # job, and this runner is here to run them, not to build them again.
    - name: Test the media natives
      run: mvn -B -pl webrtc-java-media test -DskipNativeBuild -P${{ inputs.profile }}
      shell: bash
