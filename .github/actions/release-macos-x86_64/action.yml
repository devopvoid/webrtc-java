name: 'Maven Release'

description: 'Release the platform dependent Java library'

inputs:
  java-version:
    description: 'The Java build version.'
    required: true
    default: '17'

  platform-name:
    description: 'The target platform.'
    required: true

runs:
  using: "composite"
  steps:
    - name: Derive the WebRTC cache branch from the pom
      run: echo "WEBRTC_CACHE_BRANCH=$(sed -n 's|.*<webrtc.branch>branch-heads/\([^<]*\)</webrtc.branch>.*|\1|p' webrtc-jni/pom.xml)" >> "$GITHUB_ENV"
      shell: bash

    - name: Set up WebRTC cache
      uses: actions/cache@v6
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
        key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-${{ hashFiles('webrtc-jni/pom.xml') }}
        restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-

    - name: Derive the FFmpeg version from the pom
      run: echo "FFMPEG_VERSION=$(sed -n 's|.*<ffmpeg.version>\([^<]*\)</ffmpeg.version>.*|\1|p' webrtc-java-media/pom.xml)" >> "$GITHUB_ENV"
      shell: bash

    - name: Set up FFmpeg cache
      uses: actions/cache@v6
      with:
        path: ~/ffmpeg
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-java-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt') }}-${{ hashFiles('webrtc-java-media/pom.xml') }}
        restore-keys: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-java-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt') }}-

    - name: Set up Maven cache
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: maven-${{ inputs.platform-name }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ inputs.platform-name }}-

    # The runner is Apple Silicon. The build runs natively and cross compiles
    # for Intel; only the tests need an Intel JVM, to load what was built, and
    # that one runs under Rosetta.
    - id: jdk-x64
      name: Set up JDK ${{ inputs.java-version }} (x64, for the tests)
      uses: actions/setup-java@v5
      with:
        architecture: 'x64'
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    # Set up last, so that it is the JAVA_HOME the build runs with.
    - name: Set up JDK ${{ inputs.java-version }} (arm64, for the build)
      uses: actions/setup-java@v5
      with:
        architecture: 'aarch64'
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    - name: Build
      run: mvn package -DskipTests -Pmacos-cross-x86_64
      shell: bash

    - name: Test
      run: JAVA_HOME="${{ steps.jdk-x64.outputs.path }}" mvn -B jar:jar surefire:test -Pmacos-cross-x86_64
      shell: bash

    # Maven Central publishes a version as one atomic bundle, so this job must not
    # deploy. The native library jar is handed to the aggregating publish-central
    # job instead, which attaches every platform to a single deployment.
    - name: Upload native library jar
      uses: actions/upload-artifact@v7
      with:
        name: natives-${{ inputs.platform-name }}
        path: webrtc-jni/target/webrtc-java-*.jar
        if-no-files-found: error
        retention-days: 7
        overwrite: true
