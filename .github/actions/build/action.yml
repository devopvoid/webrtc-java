name: 'Maven Build'

description: 'Build and test the native libraries of one platform, and upload them as artifacts'

inputs:
  platform-name:
    description: 'The target platform.'
    required: true

  profile:
    description: 'The Maven profile that selects a cross compiled classifier. Empty for the runner''s own.'
    required: false
    default: ''

  test:
    description: 'Whether to run the tests. Cross compiled natives that the runner cannot load are tested elsewhere.'
    required: false
    default: 'true'

  java-version:
    description: 'The Java build version.'
    required: false
    default: '17'

  jdk-architecture:
    description: 'The architecture of the JDK the build runs with. Empty for the runner''s own.'
    required: false
    default: ''

  test-jdk-architecture:
    description: 'The architecture of a second JDK the tests run with, when it differs from the build JDK.'
    required: false
    default: ''

  retention-days:
    description: 'How long the natives artifacts are kept.'
    required: false
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Derive the WebRTC cache branch from the pom
      run: echo "WEBRTC_CACHE_BRANCH=$(sed -n 's|.*<webrtc.branch>branch-heads/\([^<]*\)</webrtc.branch>.*|\1|p' webrtc-jni/pom.xml)" >> "$GITHUB_ENV"
      shell: bash

    # Restored here, saved right after the build below: the post step of
    # actions/cache only saves when the whole job succeeds, so a failing test
    # would otherwise throw away a WebRTC build that took the better part of an
    # hour.
    - id: webrtc-cache
      name: Restore WebRTC cache
      uses: actions/cache/restore@v6
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
        key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-${{ hashFiles('webrtc-jni/pom.xml') }}
        restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt') }}-

    - name: Derive the FFmpeg version from the pom
      run: echo "FFMPEG_VERSION=$(sed -n 's|.*<ffmpeg.version>\([^<]*\)</ffmpeg.version>.*|\1|p' webrtc-java-media/pom.xml)" >> "$GITHUB_ENV"
      shell: bash

    - id: ffmpeg-cache
      name: Restore FFmpeg cache
      uses: actions/cache/restore@v6
      with:
        path: ~/ffmpeg
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-java-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt') }}-${{ hashFiles('webrtc-java-media/pom.xml') }}
        restore-keys: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-java-media/src/main/cpp/dependencies/ffmpeg/CMakeLists.txt') }}-

    # One cache per OS: the dependencies do not differ between the platforms of
    # an OS. The project's own artifacts change with every build and stay out
    # of it.
    - name: Set up Maven cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/dev/onvoid/webrtc
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ runner.os }}-

    - id: test-jdk
      name: Set up JDK ${{ inputs.java-version }} (${{ inputs.test-jdk-architecture }}, for the tests)
      if: inputs.test-jdk-architecture != ''
      uses: actions/setup-java@v5
      with:
        architecture: ${{ inputs.test-jdk-architecture }}
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    # Set up last, so that it is the JAVA_HOME the build runs with.
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        architecture: ${{ inputs.jdk-architecture }}
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    - name: Build
      env:
        PROFILE: ${{ inputs.profile }}
      run: mvn -B package -DskipTests ${PROFILE:+-P$PROFILE}
      shell: bash

    - name: Save WebRTC cache
      if: steps.webrtc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
        key: ${{ steps.webrtc-cache.outputs.cache-primary-key }}

    - name: Save FFmpeg cache
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/ffmpeg
        key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

    - name: Test
      if: inputs.test == 'true'
      env:
        PROFILE: ${{ inputs.profile }}
        TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
      run: |
        if [ -n "$TEST_JAVA_HOME" ]; then
          export JAVA_HOME="$TEST_JAVA_HOME"
        fi
        mvn -B jar:jar surefire:test ${PROFILE:+-P$PROFILE} -Dsurefire.timeout=1800
      shell: bash

    # What failed, for runners that cannot be reproduced locally.
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-${{ inputs.platform-name }}
        path: '**/target/surefire-reports/'
        if-no-files-found: ignore
        retention-days: 7

    # The natives of every platform go to the callers' publishing job, which
    # attaches all of them to a single deployment, and the cross compiled ones
    # to test-natives as well. Both artifacts hold one flat jar each, so that a
    # natives-* download with merge-multiple puts every jar into one directory.
    - name: Upload native library jar
      uses: actions/upload-artifact@v7
      with:
        name: natives-${{ inputs.platform-name }}
        path: webrtc-jni/target/webrtc-java-*.jar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    # Only the classifier jar: the main jar is platform independent and the
    # publishing job builds it itself.
    - name: Upload media native library jar
      uses: actions/upload-artifact@v7
      with:
        name: natives-media-${{ inputs.platform-name }}
        path: |
          webrtc-java-media/target/webrtc-java-media-*-windows-*.jar
          webrtc-java-media/target/webrtc-java-media-*-linux-*.jar
          webrtc-java-media/target/webrtc-java-media-*-macos-*.jar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
